name: IaC Validation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'platform/iac/**'
      - '.github/workflows/iac-validate.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'platform/iac/**'
  workflow_dispatch:

jobs:
  iac_validate:
    name: Terraform Format, Validate, and Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/iac

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit info

      # 2. Record git commit SHA
      - name: Record Git Commit
        run: echo "GIT_COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # 3. Install OpenTofu
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.5"

      # 4. Terraform Format Check
      - name: "Step [1/6] Format Check"
        run: |
          echo "Checking Terraform formatting..."
          tofu fmt -check -recursive .
          if [ $? -eq 0 ]; then
            echo "✓ Format check passed"
          else
            echo "✗ Format check failed; run: tofu fmt -recursive"
            exit 1
          fi

      # 5. Terraform Validation
      - name: "Step [2/6] Terraform Validate"
        run: |
          echo "Validating Terraform configuration..."
          tofu init -backend=false
          tofu validate
          if [ $? -eq 0 ]; then
            echo "✓ Terraform validation passed"
          else
            echo "✗ Terraform validation failed"
            exit 1
          fi

      # 6. Checkov Security Scan
      # NOTE: output_file_path is a DIRECTORY, not a filename — Checkov writes
      # results_<format>.<ext> inside it (e.g. evidence/results_json.json).
      # All other options (framework, soft-fail, quiet, compact) come from
      # platform/iac/checkov.yaml — do not duplicate them here or the CLI
      # flags can conflict.
      - name: "Step [3/6] Checkov Security Scan"
        # Pinned to a commit for the same reason as the Trivy step below: this
        # file already argues that a MUTABLE ref means the bytes executed can
        # change between runs, and then used `@master` two steps later. The
        # rule and the code disagreeing is the defect, not either one alone.
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e  # master as of 2026-09-01
        with:
          directory: platform/iac
          output_format: json
          output_file_path: evidence
          config_file: platform/iac/checkov.yaml

      # 7. Save Checkov results as artifact
      - name: Upload Checkov Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: evidence/results_json.json
          retention-days: 30

      # 8. Terraform Plan (for visibility, no apply)
      - name: "Step [4/6] Terraform Plan"
        run: |
          echo "Generating Terraform plan..."
          tofu plan \
            -var-file="terraform.tfvars.example" \
            -var="git_commit_sha=${{ env.GIT_COMMIT_SHA }}" \
            -var="applied_by=github-actions" \
            -var="approval_ticket_id=${{ github.event.pull_request.number || 'none' }}" \
            -out=tfplan.json

          # Convert to JSON for better readability
          tofu show -json tfplan.json > plan.json

          echo "Plan saved to plan.json"

      # 9. Save plan as artifact
      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            platform/iac/plan.json
            platform/iac/tfplan.json
          retention-days: 30

      # 10. Display plan summary
      - name: "Step [5/6] Plan Review"
        run: |
          echo "=== Terraform Plan Summary ==="
          tofu show tfplan.json
          echo "================================"

      # 11. Build metadata for evidence
      - name: "Step [6/6] Build Evidence Metadata"
        # Context values arrive as environment variables instead of being
        # interpolated into the script body. `${{ }}` inside `run:` is
        # substituted by GitHub BEFORE the shell sees it, so any context
        # value containing shell metacharacters becomes executable code.
        # Flagged by platform/security/scan_sast.sh
        # (github-actions.security.run-shell-injection); passing through
        # `env:` removes the class entirely rather than arguing about which
        # particular context happens to be safe today.
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ env.GIT_COMMIT_SHA }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          EVENT_TYPE: ${{ github.event_name }}
        run: |
          # Built with python's json module, not a heredoc. The previous
          # version escaped only double quotes with sed, so a commit message
          # containing a backslash or control character produced invalid
          # JSON -- and the commit message is attacker-controlled by anyone
          # who can open a PR. platform/tests/test_evidence_contract.sh
          # asserts every evidence file parses, so that was a real break.
          COMMIT_MSG="$(git log -1 --pretty=%B)" \
          python3 -c '
          import json, os, datetime
          json.dump({
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "commit_message": os.environ["COMMIT_MSG"].strip(),
              "author": os.environ["ACTOR"],
              "timestamp": datetime.datetime.now(datetime.timezone.utc)
                              .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "workflow_status": "in_progress",
              "checkov_results": "evidence/results_json.json",
              "terraform_plan": "platform/iac/plan.json",
              "branch": os.environ["BRANCH"],
              "event_type": os.environ["EVENT_TYPE"],
          }, open("../../evidence/iac_metadata.json", "w"), indent=2)
          '
          echo "Evidence metadata saved"

      # 12. Upload evidence metadata
      - name: Upload Evidence Metadata
        uses: actions/upload-artifact@v4
        with:
          name: iac-evidence
          path: evidence/iac_metadata.json
          retention-days: 30

      # 13. Notification on failure
      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ IaC validation failed"
          echo "Check logs above for details"
          exit 1

      # 14. Notification on success
      - name: Notify on Success
        if: success()
        run: |
          echo "✓ IaC validation passed"
          echo "Artifacts available for review"

  # Security scanning job
  security_scan:
    name: Additional Security Scanning
    runs-on: ubuntu-latest
    needs: iac_validate
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Was: `curl -s .../master/scripts/install_linux.sh | bash` to install
      # tfsec. Replaced for three reasons, any one of which was sufficient:
      #
      #   1. curl-pipe-shell executes whatever the URL returns, with no
      #      signature, checksum or review. Flagged by
      #      platform/security/scan_sast.sh (gha-curl-pipe-shell).
      #   2. It fetched from `master` -- a MUTABLE ref. Even trusting the
      #      publisher, the bytes executed could change between runs, which
      #      is the opposite of the pinned-digest discipline this platform
      #      applies to its own images.
      #   3. tfsec is deprecated: Aqua folded it into Trivy, which this
      #      platform already uses for image scanning. Installing a
      #      deprecated tool via an unverified script to duplicate a
      #      capability we already have is three problems in one step.
      #
      # `trivy config` performs the same IaC misconfiguration scan, from a
      # version-pinned official action.
      - name: Run Trivy IaC misconfiguration scan
        continue-on-error: true
        # Pinned to a COMMIT, not a tag, for the reason stated three comments
        # up: a tag is mutable and the bytes that run can change between runs.
        #
        # The previous value was `@0.28.0`, a version that HAS NEVER EXISTED --
        # the API returns 404 for that tag. It was introduced 2026-08-15 and
        # failed every run for 17 days with:
        #     Unable to resolve action `aquasecurity/trivy-action@0.28.0`
        #
        # `continue-on-error: true` above did NOT cover it, and that is the part
        # worth remembering: action resolution happens BEFORE the step runs, so
        # continue-on-error cannot catch it. The flag read as "this scan is
        # allowed to fail" while what actually happened was the whole job
        # failing at setup -- a tolerance that tolerated nothing.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: platform/iac
          format: sarif
          output: evidence/trivy_iac.sarif

      - name: Upload Trivy IaC Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-iac-report
          path: evidence/trivy_iac.sarif
          retention-days: 30

  # Final summary
  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [iac_validate, security_scan]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "=== IaC Validation Pipeline Summary ==="
          echo "✓ Format check: ${{ needs.iac_validate.result }}"
          echo "✓ Terraform validation: ${{ needs.iac_validate.result }}"
          echo "✓ Checkov security scan: ${{ needs.iac_validate.result }}"
          echo "✓ Terraform plan: ${{ needs.iac_validate.result }}"
          echo "✓ Additional security: ${{ needs.security_scan.result }}"
          echo "========================================"

          if [ "${{ needs.iac_validate.result }}" = "failure" ]; then
            echo "❌ IaC validation failed"
            exit 1
          else
            echo "✓ IaC validation passed"
            echo "Next: Manual review of plan and approval for apply"
          fi
