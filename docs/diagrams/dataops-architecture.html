  <h1>DataOps 架構圖</h1>
  <p class="sub">粒度是資料不是結構——同一張事實表同時裝得下縣市×週、鄉鎮×年、鄉鎮×日。血緣表的算術必須收斂，那是唯一能抓到「安靜地算錯」的東西。</p>
