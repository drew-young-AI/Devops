<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataOps 流程圖</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;
    --devops:#2e5aa8;--dataops:#2f7d52;--mlops:#8a5a2b;--blocked:#a8372c;
    --font-sans:'Geist','Noto Sans TC',system-ui,sans-serif;
    --font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
  body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1280px;width:100%}
  .eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
           text-transform:uppercase;color:#2f7d52;margin-bottom:.5rem}
  h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
     letter-spacing:-.02em;line-height:1.15;margin-bottom:.4rem}
  .sub{font-size:.86rem;color:var(--color-muted);margin-bottom:1.5rem;max-width:72ch}
  svg{width:100%;min-width:960px;display:block}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Flowchart · DataOps</p>
  <h1>DataOps 流程圖</h1>
  <p class="sub">六步，其中三步會拒絕東西。第 4 步是這條線上最貴的一課：只比鍵不比值的去重，會把一筆真衝突當成重複丟掉，而總列數完全不變。</p>
<svg viewBox="0 0 1232 620" role="img" aria-labelledby="dataops-flow-title dataops-flow-desc">
  <title id="dataops-flow-title">DataOps 流程圖</title>
  <desc id="dataops-flow-desc">六步資料載入流程：列舉來源、抓取與雜湊、地理解析、重複與衝突判定、集合式 upsert、血緣寫入，每一步的拒絕條件都標在下方。</desc>
  <defs>
    <marker id="d4-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2f7d52"/></marker>
    <marker id="d4-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a8372c"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <rect x="32" y="72" width="1168" height="128" rx="8" fill="rgba(47,125,82,0.035)" stroke="rgba(47,125,82,0.28)" stroke-width="0.8"/>
  <rect x="52" y="76" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="108" y="85" fill="#2f7d52" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">取得與解析</text>

  <rect x="32" y="264" width="1168" height="128" rx="8" fill="rgba(47,125,82,0.035)" stroke="rgba(47,125,82,0.28)" stroke-width="0.8"/>
  <rect x="52" y="268" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="108" y="277" fill="#2f7d52" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">寫入與記錄</text>

  <line x1="296" y1="140" x2="452" y2="140" stroke="#2f7d52" stroke-width="1.2" marker-end="url(#d4-g)"/>
  <line x1="680" y1="140" x2="836" y2="140" stroke="#2f7d52" stroke-width="1.2" marker-end="url(#d4-g)"/>
  <path d="M 968,176 V 216 Q 968,224 960,224 H 192 Q 184,224 184,232 V 288"
        fill="none" stroke="#2f7d52" stroke-width="1.2" marker-end="url(#d4-g)"/>
  <rect x="440" y="204" width="136" height="12" rx="2" fill="#f5f5f5"/>
  <text x="448" y="213" fill="#2f7d52" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">解析成功的列才往下走</text>
  <line x1="296" y1="332" x2="452" y2="332" stroke="#2f7d52" stroke-width="1.2" marker-end="url(#d4-g)"/>
  <line x1="680" y1="332" x2="836" y2="332" stroke="#2f7d52" stroke-width="1.2" marker-end="url(#d4-g)"/>

  <rect x="72" y="104" width="224" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="104" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="88" y="124" fill="#2f7d52" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">01</text>
  <text x="184" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">列舉來源</text>
  <text x="184" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">package_list → package_show</text>

  <rect x="456" y="104" width="224" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="456" y="104" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="472" y="124" fill="#2f7d52" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">02</text>
  <text x="568" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">抓取 + 雜湊</text>
  <text x="568" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">sha256 存入血緣</text>

  <rect x="840" y="104" width="256" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="840" y="104" width="256" height="72" rx="6" fill="rgba(47,125,82,0.09)" stroke="#2f7d52" stroke-width="1.4"/>
  <text x="856" y="124" fill="#2f7d52" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">03 GATE</text>
  <text x="968" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">地理精確解析</text>
  <text x="968" y="162" fill="#2f7d52" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">對不上就拒絕，絕不硬配</text>

  <rect x="72" y="296" width="224" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="296" width="224" height="72" rx="6" fill="rgba(47,125,82,0.09)" stroke="#2f7d52" stroke-width="1.4"/>
  <text x="88" y="316" fill="#2f7d52" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">04 GATE</text>
  <text x="184" y="336" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">重複 vs 衝突</text>
  <text x="184" y="354" fill="#2f7d52" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">值同=丟 · 值異=拒絕並具名</text>

  <rect x="456" y="296" width="224" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="456" y="296" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="472" y="316" fill="#2f7d52" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">05</text>
  <text x="568" y="336" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">集合式 upsert</text>
  <text x="568" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">COPY → TEMP → 一次寫入</text>

  <rect x="840" y="296" width="256" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="840" y="296" width="256" height="72" rx="6" fill="rgba(47,125,82,0.09)" stroke="#2f7d52" stroke-width="1.4"/>
  <text x="856" y="316" fill="#2f7d52" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">06 GATE</text>
  <text x="968" y="336" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">血緣寫入</text>
  <text x="968" y="354" fill="#2f7d52" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">算不平就 INSERT 失敗</text>

  <line x1="32" y1="440" x2="1200" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="32" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">三個拒絕條件</text>
  <text x="176" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">03 地名解析不到 · 04 同鍵不同值 · 06 in_file ≠ accepted+rejected+duplicate</text>
  <text x="32" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">現況</text>
  <text x="176" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">6,503,799 事實列 · 39 筆血緣全數算術收斂 · CareMag 抓到 1 筆真衝突</text>
</svg>
</div>
</body>
</html>
