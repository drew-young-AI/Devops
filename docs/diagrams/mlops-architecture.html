<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLOps 架構圖</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;
    --devops:#2e5aa8;--dataops:#2f7d52;--mlops:#8a5a2b;--blocked:#a8372c;
    --font-sans:'Geist','Noto Sans TC',system-ui,sans-serif;
    --font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
  body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1280px;width:100%}
  .eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
           text-transform:uppercase;color:#8a5a2b;margin-bottom:.5rem}
  h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
     letter-spacing:-.02em;line-height:1.15;margin-bottom:.4rem}
  .sub{font-size:.86rem;color:var(--color-muted);margin-bottom:1.5rem;max-width:72ch}
  svg{width:100%;min-width:960px;display:block}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Architecture · MLOps</p>
  <h1>MLOps 架構圖</h1>
  <p class="sub">批次算、資料庫擋、API 只讀。紅色那個 trigger 現在正在拒絕 t+1 的模型——它輸給「假設下週跟這週一樣」。</p>
<svg viewBox="0 0 1232 640" role="img" aria-labelledby="mlops-arch-title mlops-arch-desc">
  <title id="mlops-arch-title">MLOps 架構圖</title>
  <desc id="mlops-arch-desc">mlops 批次容器讀取事實表建置特徵集，回測結果寫入 model_run，發布閘門以資料庫 trigger 阻擋輸給基準的模型，API 只讀 forecast 資料表而不載入模型。</desc>
  <defs>
    <marker id="d5-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8a5a2b"/></marker>
    <marker id="d5-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a8372c"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <rect x="32" y="72" width="424" height="312" rx="8" fill="rgba(138,90,43,0.035)" stroke="rgba(138,90,43,0.28)" stroke-width="0.8"/>
  <rect x="52" y="76" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="116" y="85" fill="#8a5a2b" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">批次（無網路）</text>

  <rect x="504" y="72" width="368" height="312" rx="8" fill="rgba(138,90,43,0.035)" stroke="rgba(138,90,43,0.28)" stroke-width="0.8"/>
  <rect x="524" y="76" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="85" fill="#8a5a2b" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">資料庫狀態</text>

  <rect x="920" y="72" width="280" height="312" rx="8" fill="rgba(138,90,43,0.035)" stroke="rgba(138,90,43,0.28)" stroke-width="0.8"/>
  <rect x="940" y="76" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="996" y="85" fill="#8a5a2b" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">服務（無模型）</text>

  <line x1="392" y1="140" x2="576" y2="140" stroke="#8a5a2b" stroke-width="1.2" marker-end="url(#d5-b)"/>
  <rect x="440" y="120" width="88" height="12" rx="2" fill="#f5f5f5"/>
  <text x="484" y="129" fill="#8a5a2b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">554W × 11F</text>
  <line x1="392" y1="248" x2="576" y2="248" stroke="#8a5a2b" stroke-width="1.2" marker-end="url(#d5-b)"/>
  <rect x="444" y="228" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="484" y="237" fill="#8a5a2b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">449 折結果</text>
  <line x1="700" y1="284" x2="700" y2="316" stroke="#a8372c" stroke-width="1.4" marker-end="url(#d5-r)"/>
  <line x1="824" y1="336" x2="996" y2="336" stroke="#8a5a2b" stroke-width="1.2" marker-end="url(#d5-b)"/>
  <rect x="876" y="316" width="68" height="12" rx="2" fill="#f5f5f5"/>
  <text x="910" y="325" fill="#8a5a2b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">SELECT</text>

  <rect x="72" y="104" width="320" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="104" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="80" y="110" width="52" height="12" rx="2" fill="transparent" stroke="rgba(138,90,43,0.40)" stroke-width="0.8"/>
  <text x="106" y="119" fill="#8a5a2b" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">FEATURE</text>
  <text x="232" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">build_features.py</text>
  <text x="232" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">全部特徵僅回看 · seasonal_index 不落地</text>

  <rect x="72" y="212" width="320" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="212" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="80" y="218" width="60" height="12" rx="2" fill="transparent" stroke="rgba(138,90,43,0.40)" stroke-width="0.8"/>
  <text x="110" y="227" fill="#8a5a2b" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">BACKTEST</text>
  <text x="232" y="252" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">backtest.py</text>
  <text x="232" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">rolling-origin · 每折重算索引</text>

  <rect x="72" y="308" width="320" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="308" width="320" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="232" y="332" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">publish_forecast.py</text>
  <text x="232" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">全資料重擬合 → 寫一列</text>

  <rect x="576" y="104" width="248" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="576" y="104" width="248" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="700" y="136" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">feature_set / feature_row</text>
  <text x="700" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">code_sha256 綁定程式碼</text>

  <rect x="576" y="212" width="248" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="576" y="212" width="248" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="700" y="244" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">model_run</text>
  <text x="700" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">beats_baselines 是 GENERATED</text>

  <rect x="576" y="320" width="248" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="576" y="320" width="248" height="64" rx="6" fill="rgba(168,55,44,0.08)" stroke="#a8372c" stroke-width="1.4"/>
  <text x="592" y="340" fill="#a8372c" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.08em">TRIGGER · 正在拒絕</text>
  <text x="700" y="360" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">forecast_gate</text>
  <text x="700" y="376" fill="#a8372c" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">輸給基準 / 隨機切分 → INSERT 失敗</text>

  <rect x="996" y="212" width="180" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="996" y="212" width="180" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="1086" y="244" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">forecast</text>
  <text x="1086" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">只有過關的才寫得進</text>

  <rect x="996" y="308" width="180" height="60" rx="6" fill="#f5f5f5"/>
  <rect x="996" y="308" width="180" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1086" y="332" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">GET /forecast</text>
  <text x="1086" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">不反序列化任何東西</text>

  <line x1="1086" y1="284" x2="1086" y2="304" stroke="#8a5a2b" stroke-width="1.2" marker-end="url(#d5-b)"/>

  <line x1="32" y1="432" x2="1200" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="32" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">為什麼 API 不載入模型</text>
  <text x="232" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">unpickle 是在最暴露的行程執行任意程式碼；且升版後會安靜地回傳不同數字而不報錯</text>
</svg>
</div>
</body>
</html>
