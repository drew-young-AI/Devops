<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLOps 流程圖</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;
    --devops:#2e5aa8;--dataops:#2f7d52;--mlops:#8a5a2b;--blocked:#a8372c;
    --font-sans:'Geist','Noto Sans TC',system-ui,sans-serif;
    --font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
  body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1280px;width:100%}
  .eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;
           text-transform:uppercase;color:#8a5a2b;margin-bottom:.5rem}
  h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;
     letter-spacing:-.02em;line-height:1.15;margin-bottom:.4rem}
  .sub{font-size:.86rem;color:var(--color-muted);margin-bottom:1.5rem;max-width:72ch}
  svg{width:100%;min-width:960px;display:block}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Flowchart · MLOps</p>
  <h1>MLOps 流程圖</h1>
  <p class="sub">六步，兩個閘門，其中一個現在正在擋。洩漏不會報錯——它只會讓回測好看、上線之後壞掉，所以第 2 步用性質測試而不是註解。</p>
<svg viewBox="0 0 1232 600" role="img" aria-labelledby="mlops-flow-title mlops-flow-desc">
  <title id="mlops-flow-title">MLOps 流程圖</title>
  <desc id="mlops-flow-desc">六步建模流程：建特徵、無前瞻驗證、每折重算季節索引、rolling-origin 回測、與兩個天真基準比較、通過才發布，其中基準比較目前拒絕 t+1 模型。</desc>
  <defs>
    <marker id="d6-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8a5a2b"/></marker>
    <marker id="d6-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a8372c"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <rect x="32" y="72" width="1168" height="128" rx="8" fill="rgba(138,90,43,0.035)" stroke="rgba(138,90,43,0.28)" stroke-width="0.8"/>
  <rect x="52" y="76" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="108" y="85" fill="#8a5a2b" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">特徵與防洩漏</text>

  <rect x="32" y="264" width="1168" height="128" rx="8" fill="rgba(138,90,43,0.035)" stroke="rgba(138,90,43,0.28)" stroke-width="0.8"/>
  <rect x="52" y="268" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="108" y="277" fill="#8a5a2b" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">評估與發布</text>

  <line x1="296" y1="140" x2="452" y2="140" stroke="#8a5a2b" stroke-width="1.2" marker-end="url(#d6-b)"/>
  <line x1="680" y1="140" x2="836" y2="140" stroke="#8a5a2b" stroke-width="1.2" marker-end="url(#d6-b)"/>
  <path d="M 968,176 V 216 Q 968,224 960,224 H 192 Q 184,224 184,232 V 288"
        fill="none" stroke="#8a5a2b" stroke-width="1.2" marker-end="url(#d6-b)"/>
  <rect x="440" y="204" width="152" height="12" rx="2" fill="#f5f5f5"/>
  <text x="448" y="213" fill="#8a5a2b" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">訓練窗只看得到自己的過去</text>
  <line x1="296" y1="332" x2="452" y2="332" stroke="#8a5a2b" stroke-width="1.2" marker-end="url(#d6-b)"/>
  <line x1="680" y1="332" x2="836" y2="332" stroke="#a8372c" stroke-width="1.4" marker-end="url(#d6-r)"/>
  <rect x="700" y="312" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="708" y="321" fill="#a8372c" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">t+1 在這裡被擋下</text>

  <rect x="72" y="104" width="224" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="104" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="88" y="124" fill="#8a5a2b" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">01</text>
  <text x="184" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">建特徵</text>
  <text x="184" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">lag · delta · 去年同期</text>

  <rect x="456" y="104" width="224" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="456" y="104" width="224" height="72" rx="6" fill="rgba(138,90,43,0.09)" stroke="#8a5a2b" stroke-width="1.4"/>
  <text x="472" y="124" fill="#8a5a2b" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">02 GATE</text>
  <text x="568" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">無前瞻性質測試</text>
  <text x="568" y="162" fill="#8a5a2b" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">截斷未來，過去不得改變</text>

  <rect x="840" y="104" width="256" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="840" y="104" width="256" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="856" y="124" fill="#8a5a2b" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">03</text>
  <text x="968" y="144" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">每折重算季節索引</text>
  <text x="968" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">刻意不落地，落地就是洩漏</text>

  <rect x="72" y="296" width="224" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="296" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="88" y="316" fill="#8a5a2b" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">04</text>
  <text x="184" y="336" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">rolling-origin 回測</text>
  <text x="184" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">449 折 · 固定 seed 42</text>

  <rect x="456" y="296" width="224" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="456" y="296" width="224" height="72" rx="6" fill="rgba(138,90,43,0.09)" stroke="#8a5a2b" stroke-width="1.4"/>
  <text x="472" y="316" fill="#8a5a2b" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">05 GATE</text>
  <text x="568" y="336" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">對比兩個天真基準</text>
  <text x="568" y="354" fill="#8a5a2b" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">持平 · 季節天真 · 同一批折</text>

  <rect x="840" y="296" width="256" height="72" rx="6" fill="#f5f5f5"/>
  <rect x="840" y="296" width="256" height="72" rx="6" fill="rgba(168,55,44,0.08)" stroke="#a8372c" stroke-width="1.4"/>
  <text x="856" y="316" fill="#a8372c" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.1em">06 GATE · 正在拒絕</text>
  <text x="968" y="336" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">發布（trigger 強制）</text>
  <text x="968" y="354" fill="#a8372c" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">t+1 拒絕 · t+2 過但僅勝 0.3%</text>

  <line x1="32" y1="432" x2="1200" y2="432" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="32" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">刻意保留的錯誤</text>
  <text x="176" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">隨機切分的結果一併入庫（split_strategy=random），因為虛高的數字光看是看不出錯的</text>
  <text x="32" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">驗證方式</text>
  <text x="176" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">第 2 步注入兩種洩漏（前看一週、全序列平均），皆被抓到</text>
</svg>
</div>
</body>
</html>
