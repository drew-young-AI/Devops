services:
  hello:
    build:
      context: .
    image: station1-hello:dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${HOST_PORT:-18080}:8080"
    environment:
      APP_VERSION: ${APP_VERSION:-station1-dev}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    # Survive a host reboot. Every service was `restart: no`, so a
    # reboot took the entire platform down and left it down: the
    # launchd agents still fired, every job failed against absent
    # containers, and the failures went to a local notification file
    # nobody was reading. `unless-stopped` rather than `always` -- a
    # deliberately stopped container must stay stopped, which is what
    # the parked blue/green colour depends on.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=1)"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 3s
