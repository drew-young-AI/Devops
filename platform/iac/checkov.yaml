# Checkov configuration for IaC security scanning
# Checkov scans Terraform, Dockerfile, Kubernetes YAML, and more for security misconfigurations
# Reference: https://www.checkov.io/documentation/user-guide/cli/
#
# NOTE: Keys in this file map 1:1 to Checkov CLI long-flag names (hyphenated).
# Validate locally with: checkov -d . --config-file checkov.yaml --framework terraform

framework:
  - terraform

# Do not download external Terraform modules during scan (offline, deterministic)
download-external-modules: false

# Do not fail the pipeline on findings yet (Phase 1 skeleton has no real cloud
# resources — only null_resource placeholders — so cloud-specific checks like
# CKV_AWS_* will not match anything). Flip to false once real provider
# resources are added in Phase 2+.
soft-fail: true

compact: true
quiet: false

# Only scan this directory (relative to -d argument passed on CLI)
skip-path:
  - ".terraform"
