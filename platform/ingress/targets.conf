# What may be exposed off this machine, and how far.
#
# name | local_port | ceiling | reason
#
# ceiling is the MAXIMUM exposure permitted, not the default action. The
# default action is always tailnet-only; funnel has to be asked for by name
# and confirmed. A ceiling of `funnel` means "may be published to the public
# internet if someone deliberately does so", never "is published".
#
#   never    refuse to expose at all, at any level
#   tailnet  may be reachable by devices signed into this tailnet
#   funnel   may additionally be published to the public internet
#
# The ceilings below are set by what AUTHENTICATES the service, not by how
# sensitive its name sounds. Three of these have no authentication of any
# kind: putting them on the tailnet would hand every enrolled device -- and
# every future device, and anyone who compromises one -- an unauthenticated
# admin surface. That is not a smaller version of publishing them, it is the
# same disclosure with a smaller audience.

# station1-hello (18080/18081) was retired on 2026-08-19 and its two funnel
# ceilings went with it. Its replacement does NOT inherit them: the ceiling is
# a property of the service, not of the slot it occupies.
station2-twin|18090|tailnet|Pilot HTTP service, and the reason this is tailnet rather than funnel. Its predecessor served a fixed JSON payload and held nothing; this one fronts a database, authenticates to Vault, and answers /surveillance/<county> from 4.4M rows. The DATA is public open data and would be harmless to publish, but the SERVICE is an unauthenticated read path into a live database with no rate limit of its own, and readiness leaks schema state. Publishing the data is a job for an export, not for exposing the server that holds it.
grafana|13000|tailnet|Has a real login and the admin password was reset off the default. Still tailnet-capped: dashboards enumerate every service, job name and metric in the platform, which is a map of the estate for anyone who does get in.
prometheus|19090|never|No authentication whatsoever. /api/v1/query reads every metric, and the admin API can delete series. There is no configuration of this that is safe to expose.
alertmanager|19093|never|No authentication. /api/v2/silences is a WRITE endpoint -- anyone reaching it can silence any alert, which turns the monitoring stack off quietly. Strictly worse than reading it.
loki|13100|never|No authentication. Holds log content that is redacted at write time but is still real production logging, and the redaction is a mitigation, not a guarantee.
vault|18200|never|Secrets. Listed explicitly rather than omitted, so that "it is not in the file" can never be mistaken for "nobody considered it".
