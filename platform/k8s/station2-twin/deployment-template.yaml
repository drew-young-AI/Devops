apiVersion: apps/v1
kind: Deployment
metadata:
  name: station2-twin-__COLOR__
  namespace: station2
  labels: { app: station2-twin, color: __COLOR__ }
spec:
  replicas: 2
  selector:
    matchLabels: { app: station2-twin, color: __COLOR__ }
  template:
    metadata:
      labels: { app: station2-twin, color: __COLOR__ }
    spec:
      containers:
        - name: twin
          image: __IMAGE__
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PGHOST, value: "host.k3d.internal" }
            - { name: PGPORT, value: "15432" }
            - { name: PGDATABASE, value: "twin" }
            # No PGUSER/PGPASSWORD. Until 2026-09-01 this manifest carried
            # `PGPASSWORD: twin-bootstrap` in plain text -- a shared password,
            # never expiring, with no revocation path -- while the Compose copy
            # of the SAME pilot had held dynamic Vault credentials since
            # 2026-08-19. The copy being promoted toward production had the
            # weaker credential model of the two.
            #
            # The app asks Vault for a database user at startup and renews it.
            # Removing the static fallback is deliberate: if Vault is
            # unreachable the pod fails readiness and is removed from the
            # Service endpoints, so blue/green cannot promote a copy that could
            # not authenticate. Failing closed is the point -- a pod that
            # silently fell back to a shared password would look identical to
            # one that got its lease.
            - { name: VAULT_ADDR, value: "http://host.k3d.internal:18200" }
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef: { name: station2-twin-vault, key: role_id }
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef: { name: station2-twin-vault, key: secret_id }
            # Placeholders are __DOUBLE_UNDERSCORED__ because the first version
            # used bare SCHEMA_VERSION, which sed also matched INSIDE the
            # variable name EXPECTED_SCHEMA_VERSION -- producing a container
            # with `EXPECTED_99=99` and no EXPECTED_SCHEMA_VERSION at all. The
            # app then fell back to its compiled default, which happened to
            # match the database, so a deliberately-broken green reported
            # "ready" and the promotion gate let it through. Caught by the
            # negative control, not by review.
            - { name: EXPECTED_SCHEMA_VERSION, value: "__SCHEMA__" }
            - { name: APP_VERSION, value: "__COLOR__-__IMAGE_TAG__" }
            - { name: GRACEFUL_DRAIN_SECONDS, value: "3" }
          # readiness, NOT liveness, decides whether this pod receives traffic.
          # A pod failing readiness is removed from the Service endpoints and
          # left running -- which is exactly what makes the schema gate a deploy
          # gate: green with the wrong schema version simply never becomes
          # eligible, so the promotion cannot even be attempted.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 2
          # liveness restarts. It must NOT depend on the database: a DB blip
          # would otherwise restart every replica of both colours at once and
          # turn a recoverable dependency failure into a full outage.
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
