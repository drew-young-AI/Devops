services:
  nginx:
    image: nginx:1.27-alpine
    user: "101:101" # nginx:alpine's built-in nginx user/group (verified: uid=101 gid=101)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    # mode=1777 (world read/write/execute + sticky bit) is required: Docker's
    # tmpfs default mode is root-owned 0755, which the non-root nginx user
    # (uid 101) cannot write into — verified locally (mkdir fails without it).
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid,mode=1777
      - /tmp:size=8m,noexec,nosuid,mode=1777
    ports:
      - "127.0.0.1:18443:8443" # develop vhost (conf.d/station1-hello.conf)
      - "127.0.0.1:19443:8444" # production-like vhost (conf.d/_generated.station1-hello.production-like.conf)
    # No host port for the internal health listener (conf.d/_platform-health.conf,
    # 127.0.0.1:8080 inside the container) — intentionally unpublished.
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach pilot services published on the host loopback (mirrors platform/observability/prometheus convention)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 3s
