services:
  nginx:
    image: nginx:1.27-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "101:101" # nginx:alpine's built-in nginx user/group (verified: uid=101 gid=101)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      # Read-only, and the vhost routes an allowlist rather than the directory:
      # docs/ also holds internal design documents (conf.d/status.conf).
      - ../../docs:/srv/status:ro
    # mode=1777 (world read/write/execute + sticky bit) is required: Docker's
    # tmpfs default mode is root-owned 0755, which the non-root nginx user
    # (uid 101) cannot write into — verified locally (mkdir fails without it).
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid,mode=1777
      - /tmp:size=8m,noexec,nosuid,mode=1777
    ports:
      - "127.0.0.1:18443:8443" # develop vhost (conf.d/station1-hello.conf)
      - "127.0.0.1:19443:8444" # production-like vhost (conf.d/_generated.station1-hello.production-like.conf)
      # The reviewer's status page, LAN-published on purpose (conf.d/status.conf).
      # Plain HTTP: mkcert certs are trusted only on this machine, and training a
      # reviewer to click through a certificate warning is the worse outcome.
      - "0.0.0.0:18085:8085" # status vhost
    # No host port for the internal health listener (conf.d/_platform-health.conf,
    # 127.0.0.1:8080 inside the container) — intentionally unpublished.
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach pilot services published on the host loopback (mirrors platform/observability/prometheus convention)
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    # Survive a host reboot. Every service was `restart: no`, so a
    # reboot took the entire platform down and left it down: the
    # launchd agents still fired, every job failed against absent
    # containers, and the failures went to a local notification file
    # nobody was reading. `unless-stopped` rather than `always` -- a
    # deliberately stopped container must stay stopped, which is what
    # the parked blue/green colour depends on.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 3s
