# Platform-level health listener — generic across all pilots, not tied to any
# single service (naming with a leading underscore keeps this distinct from
# per-pilot routing files like station1-hello.conf).
#
# Plain HTTP, loopback-only, and NOT published via Docker `ports:` in
# compose.yaml — only reachable from inside the container's network
# namespace. Exists solely so the Docker HEALTHCHECK exec probe can check
# "is the NGINX process itself alive and serving" without needing TLS trust
# (busybox wget in nginx:alpine has no --no-check-certificate flag) and
# without depending on any pilot's upstream being healthy.
server {
  listen 127.0.0.1:8080;
  server_name _;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
