# Routing template for pilot: station1-hello
# Per NEW_SERVICE_GUIDE.md, each pilot gets its own conf.d/<service-name>.conf
# routing snippet. This file is the ONLY place that names a specific pilot —
# nginx.conf itself stays pilot-agnostic (see platform/README.md boundary rule:
# "platform/ 不得依賴特定 Pilot 的業務程式").
#
# Upstream target uses host.docker.internal, matching the existing convention
# in platform/observability/prometheus/prometheus.yml (station1-hello only
# publishes to 127.0.0.1:18080 on the host, not a shared Docker network).

upstream station1_hello {
  server host.docker.internal:18080;
  keepalive 8;
}

server {
  # 8443, not 443: keeps the container capability-dropped (cap_drop: ALL —
  # binding <1024 as root requires CAP_NET_BIND_SERVICE, which we don't
  # grant). Docker publishes this to the conventional host port instead;
  # see platform/nginx/compose.yaml ("127.0.0.1:18443:8443").
  listen 8443 ssl;
  listen [::]:8443 ssl;
  http2 on;
  server_name devops.local localhost;

  ssl_certificate     /etc/nginx/certs/devops.local.crt;
  ssl_certificate_key /etc/nginx/certs/devops.local.key;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Container-level healthcheck lives on the internal, unpublished HTTP
  # listener defined in conf.d/_platform-health.conf (plain HTTP, since
  # busybox wget in nginx:alpine cannot skip TLS verification for a
  # locally-trusted mkcert certificate).

  location / {
    limit_req zone=platform_rl burst=20 nodelay;

    proxy_pass http://station1_hello;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id_final;
  }
}

# Plain HTTP is not served — TLS is mandatory per docs/Network.md local
# implementation contract. Requests to port 80 are not proxied; there is
# intentionally no `listen 80` block in this adapter.
