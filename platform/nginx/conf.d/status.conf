# The reviewer's entry point, served over the LAN.
#
# WHY THIS EXISTS.
#
# docs/Stage-Report.html was a FILE. To get it to anyone else it had to be
# sent, and a sent file is a snapshot -- the exact stale status document the
# generator exists to replace. Serving it instead means one address that is
# always current as of the last scheduled run, and the page's own timestamp
# says how current that is.
#
# It also solves the machine half of the same problem: an AI cannot read a file
# on someone's laptop either. /Stage-Report.json and /Stage-Report.md are the
# same model rendered for programs and for context windows.
#
# PLAIN HTTP, DELIBERATELY.
#
# The other vhosts use mkcert certificates, which are trusted on THIS machine
# and nowhere else. Serving this over TLS would show every reader a certificate
# warning, and a reviewer who is trained to click through warnings is a worse
# outcome than plain HTTP carrying non-secret status on a local network.
#
# ALLOWLIST, NOT autoindex off.
#
# docs/ also holds internal design documents. Hiding them behind "no directory
# listing" relies on nobody guessing a filename; that is not a refusal. Only the
# artifacts meant to be read are routed, and everything else is 404.
server {
  listen 0.0.0.0:8085;
  server_name _;
  root /srv/status;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  location = / {
    return 302 /Stage-Report.html;
  }

  # no-store, not a cache lifetime: this is a status page whose whole value is
  # being current. A reader shown a cached copy has no way to tell.
  location ~ ^/(Stage-Report\.(html|json|md)|Value-Stream-Board\.html|Pipeline-Status\.html|Access-Control\.md|Ecosystem-Scan-2026-08\.md|Ecosystem-Actions-2026-08\.md|Harness-Engineering-Notes\.md)$ {
    types {
      text/html      html;
      application/json json;
      text/markdown  md;
    }
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The eight-plate report. Routed 2026-09-02 for one reason: it existed only
  # as a published Artifact and as a file on one laptop, so the way to show it
  # to somebody was to send them a link they might not be able to open, or to
  # read a filesystem path down the phone.
  #
  # An explicit allowlist rather than a directory, because docs/report/ also
  # holds the SOURCE (plates.src.html) and the build script. Those are in git
  # and are not secret, but routing them would put two near-identical HTML
  # files a directory apart and invite somebody to present the wrong one -- the
  # source has no diagram renderer and shows eight empty boxes.
  #
  # assets/ must be routed too: the page loads its diagram library from
  # ./assets/mermaid.min.js, so routing the page alone would serve a document
  # that renders nothing. A 200 on the HTML is not the same as a working page.
  location = /report/ {
    return 302 /report/plates.offline.html;
  }

  location ~ ^/report/(plates\.offline\.html|README\.md)$ {
    types {
      text/html     html;
      text/markdown md;
    }
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /report/assets/mermaid.min.js {
    types { application/javascript js; }
    default_type application/javascript;
    # This one MAY be cached: it is a pinned, immutable vendored library, and
    # re-sending 2.5 MB on every page load over the LAN is the kind of waste
    # that gets a status page called slow.
    add_header Cache-Control "public, max-age=86400, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The decision records, as a directory rather than an allowlist: unlike docs/,
  # everything under decisions/ exists to be read. Still no autoindex -- the
  # index.md is generated and is the way in.
  location ^~ /decisions/ {
    types { text/markdown md; }
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
