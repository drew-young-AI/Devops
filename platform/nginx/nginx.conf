# Platform NGINX adapter — main configuration
# Contract (docs/Network.md "Local implementation"):
#   localhost / devops.local -> local HTTPS -> NGINX adapter -> Compose service
# Validates: routing, TLS, headers, health checks, timeout, rate limit.
# Does NOT claim to provide real F5, CDN, DDoS or VPC isolation (see docs/Network.md).

# No `user` directive: the container itself runs as non-root (uid 101, the
# image's built-in nginx user — see compose.yaml `user: "101:101"`), so
# there's no privileged master process to drop from. Also required by
# cap_drop: ALL, which removes CAP_SETUID/CAP_SETGID that `user` would need.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Structured access log (JSON) so Alloy/Loki can parse fields instead of
  # free-text grep. Alloy already tails all container stdout/stderr via the
  # Docker socket (platform/observability/alloy/config.alloy) — no extra
  # wiring needed for these logs to reach Loki/Grafana.
  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"upstream_response_time":"$upstream_response_time",'
      '"host":"$host",'
      '"correlation_id":"$request_id"'
    '}';

  access_log /dev/stdout json_combined;
  error_log  /dev/stderr warn;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65s;

  # Timeouts — bound how long a slow/unresponsive backend can hold a worker.
  client_body_timeout   10s;
  client_header_timeout 10s;
  send_timeout          10s;
  proxy_connect_timeout 5s;
  proxy_send_timeout    10s;
  proxy_read_timeout    10s;

  client_max_body_size 1m;

  # Rate limiting — shared across all vhosts in conf.d/. 10 req/s per client
  # IP with a small burst; individual server blocks opt in via limit_req.
  limit_req_zone $binary_remote_addr zone=platform_rl:10m rate=10r/s;
  limit_req_status 429;

  # TLS — modern configuration, TLS 1.2+ only.
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # Correlation ID — reuse an inbound X-Request-Id if present, else mint one.
  # Forwarded to upstream so pilot services can echo it in structured logs
  # (see NEW_SERVICE_GUIDE.md "correlation ID" requirement).
  map $http_x_request_id $request_id_final {
    default   $http_x_request_id;
    ""        $request_id;
  }

  include /etc/nginx/conf.d/*.conf;
}
