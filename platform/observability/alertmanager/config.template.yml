# TEMPLATE. The live config.yml is GENERATED from this file by
# platform/observability/scripts/setup_notifications.sh and is gitignored,
# because the Telegram chat id is an identifier for a private channel and this
# repository is public. The bot token is never in either file: Alertmanager
# reads it from bot_token_file, written chmod 600 alongside.
#
# WHY DELIVERY IS NOW WIRED, HAVING DELIBERATELY NOT BEEN.
#
# The previous version of this file said notification was "deliberately not
# wired" and that a scheduled agent polls /api/v2/alerts instead. On 2026-08-19
# that reasoning was tested by events and failed:
#
#   18:45  Docker VM restarted; Vault came back SEALED
#   19:20  station2_schema_version -> -1 (no database credential obtainable)
#   18:45  SchemaVersionUnknown -> firing, and it kept firing for 3h55m
#   22:45  a human happened to look, and only because of unrelated work
#
# Every layer worked. The metric was right, the rule was right, the alert
# fired, Alertmanager grouped it, /api/v2/alerts served it. The chain simply
# ended in `local-null`, and no polling agent was actually running -- so the
# design's one delivery assumption was the part nobody had verified.
#
# An alert that fires into a null receiver is indistinguishable from an alert
# that never fired. Grouping and inhibition are worth nothing if the last hop
# reaches no one.

route:
  # Group by alertname+environment so a promote that briefly bounces both
  # colors produces one notification, not one per target.
  group_by: ["alertname", "environment"]
  group_wait: 30s
  group_interval: 5m
  # 4h repeat, not 24h. A warning that repeats once a day is a warning you
  # learn to ignore; one that repeats every four hours is one you either fix
  # or silence deliberately -- and a deliberate silence is auditable, whereas
  # a habit of ignoring is not.
  repeat_interval: 4h
  receiver: telegram

  routes:
    - matchers:
        - severity = "critical"
      receiver: telegram
      group_wait: 10s
      repeat_interval: 1h

# NO inhibit_rules, deliberately.
#
# There was one, and `ProductionLikeAllColorsDown` was REMOVED with
# production-like Compose (commit d950a19, the retirement of station1-hello).
# It suppressed ScrapeTargetDownProlonged for the same service; the rule was
# left behind pointing at a `source_matchers` alertname that can no longer
# exist -- a routing rule that cannot fire, in a file nobody re-reads.
#
# It suppressed nothing, so nothing broke, which is exactly why it survived
# three weeks. Found 2026-09-11 by platform/docs/xref.py, which asks whether
# the names in this repository still refer to anything.

receivers:
  # Two receivers for one alert, not two routes. Telegram arrives in seconds and
  # is where an outage should be noticed; mail is where it can be found again a
  # week later, and is the channel a reviewer actually reads. Neither is a
  # fallback for the other -- a "fallback" that only sends when the first fails
  # is a channel nobody ever confirms is working.
  #
  # send_resolved is on for both: silence after a failure is indistinguishable
  # from the failure continuing.
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram-token
        chat_id: __TELEGRAM_CHAT_ID__
        api_url: https://api.telegram.org
        # parse_mode is DELIBERATELY EMPTY (plain text), and that is a fix, not
        # a downgrade. It used to be HTML. Alertmanager truncates a telegram
        # message at 4096 runes AFTER rendering, so a group large enough to hit
        # the cap got cut in the middle of a tag; Telegram then rejected the
        # whole message with
        #   Bad Request: can't parse entities: Can't find end tag
        #   corresponding to start tag "code" (400)
        # and after 17 retries the notification was dropped. Between 2026-09-07
        # and 2026-09-10, 287 of 388 sends failed this way -- silently, because
        # nothing was scraping Alertmanager (now fixed in prometheus.yml).
        #
        # With no parse_mode there is no markup to leave unbalanced, so the
        # worst case degrades from "never delivered" to "delivered, truncated".
        # A truncated alert you can act on beats a well-formatted one that
        # never arrives.
        parse_mode: ""
        # send_resolved is the half people forget. Without it you are told
        # something broke and never told it recovered, so every alert has to be
        # chased manually to find out whether it still matters -- which is how
        # people start ignoring the channel.
        send_resolved: true
        # The loop is capped at 5 alerts and the total is stated first, so the
        # message stays far below 4096 runes in the ordinary case instead of
        # relying on truncation. The cap is belt to parse_mode's braces: the
        # count line means a capped message still tells you how much you are
        # not seeing, which a truncated one does not.
        message: |-
          {{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }} · {{ .CommonLabels.alertname }} · 共 {{ len .Alerts }} 筆
          {{ range $i, $a := .Alerts }}{{ if lt $i 5 }}
          {{ $a.Annotations.summary }}
          {{ $a.Annotations.description }}
          {{ if $a.Annotations.runbook }}Runbook: {{ $a.Annotations.runbook }}{{ end }}
          {{ end }}{{ end }}
          {{ if gt (len .Alerts) 5 }}… 其餘的在看板：http://__LAN_HOST__:18085/Stage-Report.html{{ end }}

    email_configs:
      - to: __MAIL_TO__
        from: __MAIL_FROM__
        smarthost: __MAIL_SMARTHOST__:587
        auth_username: __MAIL_FROM__
        auth_password_file: /etc/alertmanager/smtp-password
        require_tls: true
        send_resolved: true
        headers:
          Subject: '[DevOps {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}{{ .Status | toUpper }}  {{ .Labels.alertname }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          service: {{ .Labels.service }}   severity: {{ .Labels.severity }}
          since:   {{ .StartsAt }}
          {{ end }}
          --
          Board: http://__LAN_HOST__:18085/Stage-Report.html
          Grafana: http://__LAN_HOST__:13000/

  # Kept for the deliberate-silence case: routing something here is an explicit
  # decision to not be told, which reads differently from a route that was never
  # finished. Nothing routes here today.
  - name: local-null
