# Alertmanager exists here for alert *lifecycle* (grouping, deduplication,
# silencing, inhibition) -- not for notification delivery, which is
# deliberately not wired. See README.md "Why no notification receiver yet".
#
# The consumer is a scheduled agent polling the API:
#   curl -s http://127.0.0.1:19093/api/v2/alerts?active=true
# and, for a deterministic verdict, platform/observability/check_health.sh

route:
  # Group by alertname+environment so a promote that briefly bounces both
  # colors produces one notification, not one per target.
  group_by: ["alertname", "environment"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: local-null

  routes:
    # Critical is separated so that when a real receiver is added later, only
    # this branch needs a destination -- the routing shape is already correct
    # rather than needing to be redesigned at that point.
    - matchers:
        - severity = "critical"
      receiver: local-null
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # A total production-like outage makes the generic long-scrape-failure
  # alert redundant noise for the same service.
  - source_matchers:
      - alertname = "ProductionLikeAllColorsDown"
    target_matchers:
      - alertname = "ScrapeTargetDownProlonged"
    equal: ["service"]

receivers:
  # Intentionally empty. An Alertmanager receiver with no configured
  # integration accepts and holds the alert; it does not send anything.
  # Alerts remain queryable via /api/v2/alerts, which is what the scheduled
  # agent reads.
  - name: local-null
