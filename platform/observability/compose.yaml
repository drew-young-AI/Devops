services:
  prometheus:
    image: prom/prometheus:v3.5.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      - alertmanager
    mem_limit: 256m
    cpus: 0.50

  alertmanager:
    image: prom/alertmanager:v0.28.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    # 127.0.0.1 only, matching Prometheus/Loki/Grafana/Vault. Alert state is
    # internal platform tooling; it is never reached from outside this Mac
    # and so does not go through the NGINX TLS adapter.
    ports:
      - "127.0.0.1:19093:9093"
    mem_limit: 128m
    cpus: 0.25

  loki:
    image: grafana/loki:3.5.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - ./loki/runtime-config.yml:/etc/loki/runtime-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:13100:3100"
    mem_limit: 256m
    cpus: 0.50

  alloy:
    image: grafana/alloy:v1.10.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    mem_limit: 128m
    cpus: 0.25

  grafana:
    image: grafana/grafana:12.1.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Anonymous access was on, which made every human RBAC control in the
      # platform moot at the one place people actually look at data: anyone
      # who could reach the port was a Viewer with access to every
      # datasource, including logs. Off now -- Grafana is the read surface
      # for the whole platform, so it needs the same identity discipline
      # Vault has.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      # Users cannot create their own orgs: org membership is how log access
      # segregation is enforced (see README "Log access segregation"), so it
      # is an administrative decision, not self-service.
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    # GF_SECURITY_ADMIN_USER / _PASSWORD come from here, sourced from Vault by
    # scripts/bootstrap_grafana_admin.sh. They are NOT declared under
    # `environment:` with ${...} interpolation, because Compose interpolates
    # only from the shell and the project `.env` -- never from `env_file:`,
    # whose values are passed straight to the container. Getting that
    # backwards fails the whole `compose config`, which is at least loud.
    #
    # A missing file is the fail-fast: Compose refuses to start rather than
    # silently booting Grafana with its default admin/admin.
    env_file:
      - .grafana.env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      - prometheus
      - loki
    mem_limit: 256m
    cpus: 0.50

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
