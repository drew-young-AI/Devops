# The status board's own nodes, made into alerts.
#
# WHY THIS FILE EXISTS (2026-09-01).
#
# `dag.py` has exported `devops_node_state` for weeks and NOTHING CONSUMED IT.
# A node could go red, the board would show it in red, and no one would be
# told -- which is only a notification if somebody happens to open a web page.
#
# That is not hypothetical. GitHub Actions was red on 13 of the last 20 runs
# and had been failing for at least six days before anyone noticed, and the
# reason was exactly this: state existed, was correct, was rendered, and
# reached no channel. The 2026-08-19 incident had the same shape one hop
# further along -- the alert fired for 3h55m into a null receiver.
#
# Every layer working is not the same as the chain being connected.

groups:
  - name: platform-nodes
    rules:
      # 30m, not immediately: dag.py runs every 15 minutes, so a node must be
      # red across two consecutive evaluations. One cycle would page on the
      # transient state of a probe that was mid-restart.
      - alert: PlatformNodeFailed
        expr: devops_node_state{state="fail"} == 1
        for: 30m
        labels:
          severity: warning
          service: platform
        annotations:
          summary: "節點 {{ $labels.node }}（{{ $labels.layer }} 層）狀態為 FAIL"
          description: >-
            狀態板上的節點紅了超過兩個評估週期。板面看得到，但看得到不等於有人被告知——
            這條規則存在的理由就是「有狀態、有畫面、沒有通道」這個組合。
          runbook: "python3 platform/statusdag/dag.py 看該節點的細節"

      # THE ONE THAT GUARDS THE OTHERS.
      #
      # node-exporter keeps serving the last textfile it read. If dag.py stops
      # running, every node metric FREEZES AT ITS LAST VALUE -- and a frozen
      # green board is indistinguishable from a healthy one. The rule above
      # would then be permanently, silently satisfied.
      #
      # 45 minutes: three missed 15-minute cycles.
      - alert: PlatformBoardStale
        expr: time() - node_textfile_mtime_seconds{file="/textfile/dag.prom"} > 2700
        for: 10m
        labels:
          severity: warning
          service: platform
        annotations:
          summary: "狀態板已 {{ $value | humanizeDuration }} 未更新"
          description: >-
            node-exporter 會繼續提供最後讀到的 textfile，所以 dag.py 停掉之後
            每個節點指標都會凍結在最後一個值。凍結的綠燈和健康的綠燈長得一模一樣。
          runbook: "platform/scheduler/status.sh 查 dag 這個工作"
