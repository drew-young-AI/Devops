# Deterministic "is the service healthy" definitions.
#
# These exist so that a scheduled agent (or a human) has a *single, fixed,
# reproducible* answer to "服務好不好" instead of re-interpreting a Grafana
# dashboard by eye every time. The threshold lives here, in version control,
# not in whoever happens to be looking at the graph.
#
# Every rule below is written only against metrics that actually exist today
# (`up`, `station2_requests_total`, `station2_errors_total`,
# `station2_db_errors_total`, `station2_schema_version`). Writing rules
# against metrics that are never produced would give alerts that can never
# fire, which reads as "all clear" and is worse than an acknowledged gap. See
# README.md "Known gaps".
#
# CPU, memory and container restarts are still absent for that reason.
#
# CORRECTED 2026-09-03. This paragraph used to justify the absence with
# "nothing collects those metrics yet (no cAdvisor/node-exporter)".
# node-exporter had been running for weeks by then. The half that was true --
# it is started with `--collector.disable-defaults --collector.textfile`, so
# it produces nothing but the textfile drop -- kept the conclusion looking
# right while its stated reason had quietly become false, and nobody re-read
# it. That is what an acknowledged gap costs when it is not dated: it stops
# being a decision and becomes a belief.
#
# The gap it was hiding closed the hard way. On 2026-09-03 the host volume
# filled, Docker's engine died at 11:23 and every container went down --
# a resource none of these rules measured. Host disk now has its own file,
# alerts/host-capacity.yml, fed by a host-side exporter rather than by
# node-exporter's own collectors, which inside a Linux VM would describe the
# VM's disk and not the Mac's.
#
# Retargeted from station1-hello to station2-twin on 2026-08-19. The old rules
# were syntactically fine and permanently green, because they watched a service
# that had been deleted -- the exact "unknown is not healthy" failure, with the
# extra twist that the monitoring looked healthiest at the moment it had
# stopped monitoring anything.

groups:
  - name: service-availability
    rules:
      - alert: DevelopServiceDown
        expr: up{job="station2-twin"} == 0
        for: 1m
        labels:
          severity: warning
          environment: develop
        annotations:
          summary: "station2-twin develop is not responding to scrapes"
          description: >-
            Prometheus could not scrape the develop instance for 1 minute.
            Develop is warning, not critical: it carries no traffic and is
            expected to be torn down and rebuilt routinely.
          runbook: "docker compose -f pilots/station2-twin/compose.yaml ps"

      # Catch-all so any future scrape target (a second pilot, a dataops
      # service, an exporter) gets availability coverage the moment it is
      # added, without someone remembering to write a rule for it.
      - alert: ScrapeTargetDownProlonged
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} down 10m+"
          description: >-
            A monitored target has been unreachable for 10 minutes. Generic
            coverage for targets that have no dedicated rule yet.

          runbook: "curl -s 127.0.0.1:19090/api/v1/targets 找該 job 的 lastError；再 docker ps 確認容器還在"
      # No blue/green rule any more. station1-hello had two colours and this
      # file carried a sum()-over-colours rule so the parked colour would not
      # alert. station2-twin has no colours yet -- its compose bundles the
      # database with the app -- so a rule mentioning them would be fiction.
      # It comes back with the tier split (docs/Backlog.md).

  - name: service-errors
    rules:
      # Guarded against 0/0: with no traffic the ratio is undefined, and an
      # unguarded division yields NaN, which compares false and silently
      # never fires. The `> 0` traffic clause makes "no traffic" an explicit
      # non-alerting state rather than an accidental one.
      - alert: HighErrorRate
        expr: >-
          rate(station2_errors_total[5m])
            / rate(station2_requests_total[5m]) > 0.10
          and rate(station2_requests_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} ({{ $labels.environment }}) error ratio above 10%"
          description: >-
            More than 10% of requests returned 4xx/5xx over a 5 minute window,
            sustained for 5 minutes.
          runbook: "Grafana DevOps Overview, then Loki: {compose_project=~\"station2-twin.*\"}"

  - name: data-plane
    rules:
      # station2-twin is stateful, which gives it failure modes station1-hello
      # could not have. These two are the ones that are invisible from the
      # outside: the service answers /health/live perfectly while being unable
      # to read its own data.

      - alert: DatabaseErrorsRising
        expr: rate(station2_db_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "station2-twin is failing database operations"
          description: >-
            Database errors have been non-zero for 5 minutes. Liveness stays
            green through this -- the process is fine, its dependency is not --
            so nothing else would surface it.
          runbook: "curl -s localhost:18090/health/ready | jq"

      # -1 is what the app reports when it cannot read schema_migrations at
      # all. A mismatch against the expected version is caught by readiness
      # (the deploy never takes traffic); this catches the case where the
      # service is already serving and the schema moves underneath it.
      - alert: SchemaVersionUnknown
        expr: station2_schema_version == -1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "station2-twin cannot determine its schema version"
          description: >-
            The service cannot read schema_migrations. Three causes, in the
            order they have actually occurred here: (1) Vault is SEALED, so no
            database credential can be issued -- happens after EVERY restart of
            the Docker VM, because this deployment has no auto-unseal;
            (2) the Vault credential expired and the pool was not rebuilt;
            (3) the database is genuinely unreachable or is the wrong one.
            Check /health/ready first -- it names which one.
          runbook: >-
            curl -s localhost:18090/health/ready | python3 -m json.tool;
            if it says credentials_unavailable, run
            platform/vault/scripts/init_and_unseal.sh;
            otherwise platform/db/migrate.sh station2-twin --status
