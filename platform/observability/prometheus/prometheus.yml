global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # station1-hello was retired on 2026-08-19. It was a stateless pilot whose
  # job was to prove the pipeline end to end; station2-twin now carries real
  # data, a database, migrations and Vault-issued credentials, so it is the
  # workload worth monitoring.
  #
  # Retiring it exposed a gap worth naming: station2-twin had been running for
  # days with NO scrape target at all. The monitoring stack was green the whole
  # time, because it was watching the pilot that no longer mattered. A dashboard
  # showing "all healthy" for the wrong service is the failure mode this
  # platform keeps coming back to -- unknown is not healthy, and neither is
  # "healthy, but about something else".
  - job_name: station2-twin
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18090"]
        labels:
          environment: develop
          service: station2-twin

  # THE KUBERNETES COPY. Added 2026-09-01, and the reason is the paragraph above
  # happening a second time with the roles reversed.
  #
  # The pilot runs in two places. The board said it had "migrated to
  # Kubernetes"; Prometheus had two targets and the Kubernetes copy was neither
  # of them. It was not a missing entry here -- there was NO ROUTE: the copy sat
  # on a ClusterIP and k3d published nothing but the API port, so this scrape
  # was impossible even in principle. `station2-twin-metrics` (NodePort 30890,
  # mapped to host 18091) is what makes it reachable.
  #
  # `environment: k8s` rather than develop, because the two copies are genuinely
  # different deployments -- different credential paths (vault vs static),
  # different substrates -- and giving them the same environment label would
  # merge two things whose divergence is the whole point of watching them.
  #
  # It follows the ACTIVE colour only: the metrics service carries the same
  # `color` selector that promote.sh patches. The idle colour is not visible
  # here; that needs in-cluster service discovery.
  - job_name: station2-twin-k8s
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18091"]
        labels:
          environment: k8s
          service: station2-twin

  # NO production-like job yet, on purpose.
  #
  # Blue/green for station2-twin is not wired: its compose bundles the database
  # with the application, so a second colour would try to start a second
  # postgres on the same host port and the same named volume. Splitting the
  # tiers is the open item (see docs/Backlog.md).
  #
  # Listing 18081/18082 here anyway would give two targets that are down
  # permanently, which trains everyone to ignore a red panel. An acknowledged
  # gap beats an alert that can never mean anything.

  # The platform's own DAG state, via node_exporter's textfile collector.
  # dag.py writes the .prom file every 15 minutes (jobs.conf); this scrapes it
  # every 15s. The gap is deliberate -- probing a database and a cluster every
  # 15 seconds would cost more than the freshness is worth, and
  # devops_board_generated_seconds is exported so a dashboard can show exactly
  # how old the underlying probe is rather than implying it is 15s fresh.
  - job_name: platform-dag
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: statusdag
