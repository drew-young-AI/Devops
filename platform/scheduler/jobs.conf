# Scheduled jobs.  name|interval_seconds|timeout_seconds|command
#
# Cadence is chosen per job from how fast the thing it watches can change,
# not from a uniform "hourly because that felt right":
#
#   health      900   the core up/down signal, and cheap (~2s)
#   board       900   derived from evidence; stale board = misleading board
#   dag         900   the traffic-light view; same argument as board -- a
#                     stale green light is worse than no light at all
#   stagereport 900   the reviewer's view of the same probes. Follows dag
#                     because it is derived from the same build(): a stage
#                     page older than the board it summarises would disagree
#                     with it, and the reviewer has no way to tell which one
#                     is lying
#   mirror      86400 the analytical Parquet mirror. `refresh` checks the
#                     database watermark first and rebuilds only when behind,
#                     so the usual run costs 0.8s rather than 9s. Daily
#                     because ingest is a batch that lands on the order of
#                     days -- and because a stale mirror REFUSES to answer
#                     rather than answering wrongly, cadence is a freshness
#                     convenience here, not a safety control
#   dataops      3600 freshness / drift / execution-health metrics. Hourly
#                     rather than daily because the freshness alert is the
#                     one that answers "did the upstream stop", and a daily
#                     metric makes that question up to a day stale itself.
#                     Cheap: small tables from Postgres plus one aggregate
#                     over the mirror
#   audit       86400 fail-closed risk, but slow-moving
#   backup      86400 platform state changes on the order of days
#   offsite     86400 follows backup. Reports not-configured until a
#                     destination exists -- a visible state, rather than
#                     the silent absence of any offsite copy at all
#   dast        86400 the deployed surface changes only on promote
#   sast       604800 code is gated in CI already; this catches UPSTREAM rule
#                     updates finding old code, which is the only reason a
#                     weekly re-scan of unchanged source is worth anything
#   restore    604800 expensive (spins a container), and the claim it proves
#                     -- "the backup is restorable" -- degrades slowly
#   rotation   604800 90-day secret policy; daily would be noise
#   retrain    604800 the SOURCE is weekly and lags ~2 weeks. Retraining daily
#                     would rebuild an identical feature set six days in seven
#                     and write model_run rows differing only by timestamp --
#                     noise that hides the one real weekly change
#
# Timeouts exist because a hung job is worse than a failed one: it holds the
# lock, and every later run is skipped while the schedule still looks green.
health|900|120|platform/observability/check_health.sh --json
board|900|120|python3 platform/valuestream/board.py
dag|900|180|python3 platform/statusdag/dag.py --prometheus evidence/statusdag/dag.prom
stagereport|900|180|python3 platform/statusdag/stage_report.py
mirror|86400|300|platform/analytics/run.sh refresh
dataops|3600|300|platform/dataops/run.sh
audit|86400|300|platform/vault/scripts/rotate_audit_log.sh
backup|86400|600|platform/backup/backup.sh
offsite|86400|1800|platform/backup/sync_remote.sh
dast|86400|900|platform/security/scan_dast.sh
sast|604800|900|platform/security/scan_sast.sh
restore|604800|900|platform/backup/restore_drill.sh
rotation|604800|120|platform/vault/scripts/check_rotation_sweep.sh
retrain|604800|1800|platform/mlops/retrain.sh
gha|1800|90|platform/ci/fetch_gha_status.sh
